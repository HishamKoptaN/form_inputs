name: form_inputs_example
description: Demonstrates how to use the form_inputs package
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.6'
dependencies:
  flutter:
    sdk: flutter
  formz: ^0.8.0
  form_inputs:
    path: ..
  freezed_annotation: ^3.1.0
  flutter_bloc: ^9.1.1
  injectable: ^2.3.0
dev_dependencies:
  build_runner: ^2.6.0
  freezed: ^3.2.3
  injectable_generator: ^2.4.0
  flutter_arb_translator: ^1.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
